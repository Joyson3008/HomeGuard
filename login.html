<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeGuard Sign in</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-body"><main class="auth-card"><div class="eyebrow"><span class="eyebrow-line"></span> HOMEGUARD SECURITY</div><h1 id="auth-title">Sign in<span class="title-period">.</span></h1><p id="auth-help">Enter your HomeGuard administrator password.</p><form id="auth-form"><label id="confirm-label" hidden>Confirm password<input id="confirm-password" type="password" autocomplete="new-password"></label><label>Password<input id="password" type="password" required minlength="12" autocomplete="current-password"></label><button class="connect-button" id="auth-submit">SIGN IN</button></form><p class="device-message" id="auth-message" role="status"></p></main><script>
const form=document.querySelector('#auth-form'),msg=document.querySelector('#auth-message'),pwd=document.querySelector('#password'),confirmLabel=document.querySelector('#confirm-label'),confirmPwd=document.querySelector('#confirm-password'),submit=document.querySelector('#auth-submit');let setup=false;
fetch('/api/auth/status').then(r=>r.json()).then(s=>{setup=!s.configured;if(setup){document.querySelector('#auth-title').innerHTML='Create admin password<span class="title-period">.</span>';document.querySelector('#auth-help').textContent='First run: set a password of at least 12 characters.';confirmLabel.hidden=false;confirmPwd.required=true;submit.textContent='CREATE ACCOUNT';pwd.autocomplete='new-password';}}).catch(()=>msg.textContent='Start HomeGuard using start-homeguard.ps1.');
form.addEventListener('submit',async e=>{e.preventDefault();if(setup&&pwd.value!==confirmPwd.value){msg.textContent='Passwords do not match.';return;}let r;try{r=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd.value})});}catch{msg.textContent='Cannot reach the local HomeGuard service.';return;}const d=await r.json();if(!r.ok){msg.textContent=d.error||'Authentication failed.';return;}location.href='/';});
</script></body></html>
